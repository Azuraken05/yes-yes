<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aglea - Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold-light: #fff3c4;
      --gold-primary: #e6be64;
      --gold-rich: #c89332;
      --gold-deep: #845e1b;
      --accent-glow: rgba(230, 190, 100, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e1738 0%, #0c0b17 50%, #06050b 100%);
      color: #f7f3e8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #silkCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
    }

    .folder-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .folder-stage.hide {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      display: none;
    }

    .folder-hint {
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
      animation: pulseText 2s ease-in-out infinite alternate;
    }

    @keyframes pulseText {
      0% { opacity: 0.6; text-shadow: 0 0 5px rgba(230, 190, 100, 0.2); }
      100% { opacity: 1; text-shadow: 0 0 15px rgba(230, 190, 100, 0.8); }
    }

    .folder-card {
      position: relative;
      width: 280px;
      height: 200px;
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .folder-card:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .folder-card:hover .folder-front {
      border-color: #ffe89e;
      box-shadow: 0 15px 35px rgba(230, 190, 100, 0.35);
    }

    .folder-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #443015 0%, #1c152a 100%);
      border-radius: 12px;
      border: 2px solid var(--gold-rich);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .folder-tab {
      position: absolute;
      top: -16px;
      left: 20px;
      width: 90px;
      height: 22px;
      background: var(--gold-rich);
      border-radius: 8px 8px 0 0;
      border: 2px solid var(--gold-rich);
      border-bottom: none;
    }

    .folder-front {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 85%;
      background: linear-gradient(160deg, rgba(65, 47, 24, 0.95), rgba(28, 21, 46, 0.95));
      backdrop-filter: blur(8px);
      border-radius: 4px 14px 12px 12px;
      border: 2px solid var(--gold-primary);
      box-shadow: inset 0 0 20px rgba(230, 190, 100, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.3s;
    }

    .folder-crest-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(230, 190, 100, 0.6));
      pointer-events: none;
    }

    .folder-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 2px;
    }

    .folder-sub {
      font-size: 0.75rem;
      color: rgba(255, 243, 196, 0.7);
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid rgba(230, 190, 100, 0.2);
    }

    .player-stage {
      display: none;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
      max-width: 420px;
    }

    .player-stage.show {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
      transform: scale(1);
    }

    .player-card {
      position: relative;
      background: linear-gradient(180deg, rgba(26, 21, 42, 0.95) 0%, rgba(13, 12, 24, 0.98) 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 24px;
      box-shadow: 0 0 45px rgba(230, 190, 100, 0.25), inset 0 0 30px rgba(230, 190, 100, 0.08);
      padding: 40px 30px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .close-corner-btn {
      position: absolute;
      top: 15px;
      right: 18px;
      background: transparent;
      border: none;
      color: rgba(255, 243, 196, 0.6);
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1;
    }

    .close-corner-btn:hover {
      color: #fff;
      transform: scale(1.15);
    }

    .disc-container {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 22px;
      margin-top: 10px;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2315 20%, #110d1c 21%, #1e162d 50%, #0d0a14 70%);
      border: 4px solid var(--gold-rich);
      box-shadow: 0 0 25px rgba(230, 190, 100, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .vinyl.spinning {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .vinyl-center {
      width: 52px;
      height: 52px;
      background: radial-gradient(circle, #ffe694 0%, var(--gold-rich) 100%);
      border-radius: 50%;
      border: 3px solid #110d1c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .vinyl-crest-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .audio-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .audio-status {
      font-size: 0.85rem;
      color: var(--gold-primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .control-btn {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      padding: 9px 20px;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      background: rgba(230, 190, 100, 0.15);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .exit-btn {
      border-color: rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.7);
    }

    .exit-btn:hover {
      border-color: #ff7777;
      color: #ff9999;
      background: rgba(255, 100, 100, 0.1);
      box-shadow: 0 0 12px rgba(255, 100, 100, 0.25);
    }
  </style>
</head>
<body>

  <canvas id="silkCanvas"></canvas>

  <audio id="bgAudio" src="Aglea.wav" preload="auto"></audio>

  <main class="main-wrap">
    
    <section class="folder-stage" id="folderStage">
      <div class="folder-hint">✦ Golden Garment Archive ✦</div>
      <div class="folder-card" id="greetingFolder">
        <div class="folder-tab"></div>
        <div class="folder-back"></div>
        <div class="folder-front">
          <img src="Crest.png" alt="Crest" class="folder-crest-img" />
          <div class="folder-title">Aglea.wav</div>
          <div class="folder-sub">📁 Click to Open & Play</div>
        </div>
      </div>
    </section>

    <section class="player-stage" id="playerStage">
      <div class="player-card">
        <button class="close-corner-btn" id="closeCornerBtn" title="Exit">✕</button>

        <div class="disc-container">
          <div class="vinyl" id="vinylDisc">
            <div class="vinyl-center">
              <img src="Crest.png" alt="Crest" class="vinyl-crest-img" />
            </div>
          </div>
        </div>
        
        <div class="audio-title">Aglea.wav</div>
        <div class="audio-status" id="audioStatus">Playing...</div>
        
        <div class="btn-row">
          <button class="control-btn" id="toggleBtn">Pause</button>
          <button class="control-btn exit-btn" id="exitBtn">Exit</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    const audio = document.getElementById('bgAudio');
    const folder = document.getElementById('greetingFolder');
    const folderStage = document.getElementById('folderStage');
    const playerStage = document.getElementById('playerStage');
    const vinylDisc = document.getElementById('vinylDisc');
    const audioStatus = document.getElementById('audioStatus');
    const toggleBtn = document.getElementById('toggleBtn');
    const exitBtn = document.getElementById('exitBtn');
    const closeCornerBtn = document.getElementById('closeCornerBtn');

    function setPlayingState(isPlaying) {
      if (isPlaying) {
        vinylDisc.classList.add('spinning');
        audioStatus.innerText = "Playing...";
        toggleBtn.innerText = "Pause";
      } else {
        vinylDisc.classList.remove('spinning');
        audioStatus.innerText = "Paused";
        toggleBtn.innerText = "Play";
      }
    }

    folder.addEventListener('click', () => {
      audio.currentTime = 0;
      audio.play().then(() => {
        setPlayingState(true);
      }).catch(err => {
        setPlayingState(false);
      });

      folderStage.classList.add('hide');
      setTimeout(() => {
        playerStage.classList.add('show');
      }, 250);
    });

    audio.addEventListener('ended', () => {
      vinylDisc.classList.remove('spinning');
      audioStatus.innerText = "Finished";
      toggleBtn.innerText = "Replay";
    });

    toggleBtn.addEventListener('click', () => {
      if (audio.paused || audio.ended) {
        if (audio.ended) audio.currentTime = 0;
        audio.play().then(() => setPlayingState(true));
      } else {
        audio.pause();
        setPlayingState(false);
      }
    });

    function exitToFolder() {
      audio.pause();
      audio.currentTime = 0;
      setPlayingState(false);
      
      playerStage.classList.remove('show');
      setTimeout(() => {
        folderStage.classList.remove('hide');
      }, 250);
    }

    exitBtn.addEventListener('click', exitToFolder);
    closeCornerBtn.addEventListener('click', exitToFolder);

    const canvas = document.getElementById('silkCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 2 + 1,
        speedY: -(Math.random() * 0.4 + 0.2),
        speedX: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.8 + 0.2,
        pulsing: Math.random() * 0.02 + 0.01
      });
    }

    let time = 0;
    function animate() {
      time += 0.01;
      ctx.clearRect(0, 0, width, height);

      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.strokeStyle = j === 0 ? 'rgba(230, 190, 100, 0.18)' : j === 1 ? 'rgba(255, 240, 180, 0.12)' : 'rgba(180, 130, 45, 0.15)';
        ctx.lineWidth = 2 + j * 1.5;

        for (let x = 0; x <= width; x += 20) {
          const y = (height * 0.45) + Math.sin(x * 0.003 + time + j * 1.5) * 60 + Math.cos(time * 0.5 + x * 0.002) * 40;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      for (let p of particles) {
        p.y += p.speedY;
        p.x += p.speedX;
        p.alpha += Math.sin(time * 5) * p.pulsing;

        if (p.y < -10) p.y = height + 10;
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        ctx.fillStyle = `rgba(255, 230, 150, ${Math.max(0.1, Math.min(1, p.alpha))})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
